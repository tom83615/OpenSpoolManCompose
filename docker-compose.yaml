services:
  spoolman:
    image: ghcr.io/donkie/spoolman:latest
    container_name: spoolman
    restart: unless-stopped
    environment:
      TZ: Asia/Taipei
      DB_TYPE: sqlite
      DB_PATH: /home/app/.local/share/spoolman/spoolman.db
    volumes:
      - ${DATA_DIR}/spoolman:/home/app/.local/share/spoolman
    networks:
      - spoolnet
    logging: &logging-config
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  openspoolman_1:
    image: ghcr.io/drndos/openspoolman:latest
    container_name: openspoolman_1
    restart: unless-stopped
    env_file:
      - .env.printer1
    environment:
      TZ: Asia/Taipei
      SPOOLMAN_BASE_URL: http://spoolman:8000
      OPENSPOOLMAN_BASE_URL: https://openspoolman.local/
    depends_on:
      - spoolman
    ports:
      - "7914:8000"
    networks:
      - spoolnet
    logging: *logging-config

  openspoolman_2:
    image: ghcr.io/drndos/openspoolman:latest
    container_name: openspoolman_2
    restart: unless-stopped
    env_file:
      - .env.printer2
    environment:
      TZ: Asia/Taipei
      SPOOLMAN_BASE_URL: http://spoolman:8000
      OPENSPOOLMAN_BASE_URL: https://openspoolman.local/
    depends_on:
      - spoolman
    ports:
      - "7915:8000"
    networks:
      - spoolnet
    logging: *logging-config

  caddy:
    image: caddy:latest
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ${DATA_DIR}/caddy:/data
      - ./static:/srv
      - ./.env.printer1:/srv/p1.env:ro
      - ./.env.printer2:/srv/p2.env:ro
    networks:
      - spoolnet
    logging: *logging-config

  node_exporter:
    image: prom/node-exporter:latest
    container_name: node_exporter
    restart: unless-stopped
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc|rootfs/var/lib/docker/containers|rootfs/var/lib/docker/overlay2|rootfs/run/docker/netns|rootfs/var/lib/docker/aufs)($$|/)'
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
    ports:
      - "9100:9100"
    networks:
      - spoolnet
    logging: *logging-config

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ${DATA_DIR}/prometheus:/prometheus
    tmpfs:
      - /prometheus/wal:size=256m
    ports:
      - "9090:9090"
    networks:
      - spoolnet
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
      - '--storage.tsdb.retention.time=7d'
      - '--storage.tsdb.wal-compression'
    logging: *logging-config

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    volumes:
      - ${DATA_DIR}/grafana:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
      - GF_LOG_LEVEL=warn
    ports:
      - "3000:3000"
    networks:
      - spoolnet
    depends_on:
      - prometheus
    user: "0:0"
    logging: *logging-config

networks:
  spoolnet:
    driver: bridge