global:
  scrape_interval: 5m
  evaluation_interval: 5m

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'node_exporter'
    scrape_interval: 1m
    static_configs:
      - targets: ['node_exporter:9100']

  - job_name: 'spoolman'
    metrics_path: /metrics
    static_configs:
      - targets: ['spoolman:8000']